# 公网服务器：https://codis.fun 作为小程序唯一合法域名
server {
    listen 443 ssl;
    http2 on;
    server_name codis.fun;

    ssl_certificate     /etc/letsencrypt/live/codis.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codis.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 菜谱图片上传，默认 1m 会返回 413
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # frp 隧道多一跳，默认 60s 可能截断 AI 估算等慢接口
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name codis.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}